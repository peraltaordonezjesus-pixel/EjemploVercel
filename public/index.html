<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de alumnos</title>

    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <h1>Lista de alumnos</h1>

    <h2>Registrar alumno</h2>

    <form id="formUsuario">

        <input
            type="text"
            id="nombre"
            placeholder="Nombre"
            required
        >

        <input
            type="email"
            id="correo"
            placeholder="Correo"
            required
        >

        <input
            type="password"
            id="contrasena"
            placeholder="Contraseña"
            required
        >

        <button type="submit">
            Registrar
        </button>

    </form>
 
    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
            </tr>
        </thead>

        <tbody id="tablaUsuarios">
        </tbody>

    </table>

    <script src="/app.js"></script>

</body>

</html>
